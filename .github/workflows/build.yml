name: Build

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed release APK
    environment: ANDROID_KEYSTORE
    runs-on: ubuntu-latest
    # Only this job may touch releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Init the direct submodules (devourer + wfb-ng) but NOT recursively:
          # devourer's reference/* vendor-kernel submodules are only used by its
          # extraction tooling / hardware tests, never compiled into the APK, and
          # one of them currently pins an unpushed commit that breaks a recursive
          # clone. wfb-ng has no nested submodules.
          submodules: true
          # Full history + tags: app/build.gradle derives versionName/versionCode from git.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/pixelpilot.jks"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/pixelpilot.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=pixelpilot \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk PixelPilot.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PixelPilot-${{ github.ref_name }}-${{ github.sha }}
          path: PixelPilot.apk
          if-no-files-found: error

      # master -> rolling "latest" pre-release; v* tag -> real release with generated notes.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: PixelPilot.apk
