name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exact pin: output differs even between 18.x point releases (Ubuntu's
      # 18.1.3 and PyPI's 18.1.8 disagree), and the tree is kept clean against
      # this one. Developers can match it with: pip install clang-format==18.1.8
      - name: Install clang-format 18.1.8
        run: |
          pipx install clang-format==18.1.8
          clang-format --version

      - name: Run scripts/format_sources.sh
        run: scripts/format_sources.sh

      - name: Fail if formatting changed anything
        run: |
          if ! git diff --exit-code; then
            echo "::error::Sources are not clang-formatted. Run scripts/format_sources.sh and commit the result."
            exit 1
          fi

  native-test:
    name: Host GoogleTest (videonative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S app/videonative/src/main/cpp/tests -B build/gtest -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/gtest --parallel

      - name: Test
        run: ctest --test-dir build/gtest --output-on-failure

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      # Non-recursive on purpose: the build only needs devourer and wfb-ng
      # themselves. devourer's own reference/ submodules are vendor driver
      # trees that are not compiled here and are not always fetchable.
      # This also checks that the pinned devourer / wfb-ng commits exist upstream.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew assembleDebug

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PixelPilot-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
